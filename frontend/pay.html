<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWise — Secure Payment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pay-page">
<div class="pay-screen">
  <div class="pay-brand">
    <svg width="32" height="32" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="30" stroke="#2563eb" stroke-width="6"/><polygon points="50,20 60,50 50,80 40,50" fill="#2563eb"/></svg>
    <span>TripWise</span>
  </div>
  <div class="pay-card" id="payCard">
    <div class="pay-card-head">
      <span class="pay-label">Amount to pay</span>
      <div class="pay-amount" id="payAmount">—</div>
      <div class="pay-ref" id="payRef">—</div>
    </div>
    <div class="pay-timer">Complete payment to confirm your booking</div>
    <div class="pay-buttons">
      <button class="btn-pay" id="btnPay" onclick="completePayment()">Pay Now</button>
      <button class="btn-later" id="btnLater" onclick="payLater()">Pay Later</button>
    </div>
    <div class="pay-status" id="payStatus"></div>
  </div>
  <div class="pay-footer"><p>Secure payment · Powered by TripWise</p></div>
</div>
<div class="toast" id="toast"></div>
<script src="js/pay.js"></script>
</body>
</html>
