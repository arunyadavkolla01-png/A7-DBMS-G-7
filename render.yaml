services:
  - type: web
    name: tripwise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tripwise-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false
  - type: web
    name: tripwise-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: tripwise-backend
          type: web
          property: host

databases:
  - name: tripwise-postgres
    databaseName: tripwise
    user: tripwise_user